<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#ffffff; font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Shadow filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arrow-dash-green" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="12" y="12" width="1256" height="696" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>

  <!-- ================= HEADER BANNER ================= -->
  <g transform="translate(420, 32)">
    <rect x="0" y="0" width="440" height="48" rx="8" fill="#0d47a1" filter="url(#card-shadow)"/>
    <text x="220" y="32" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Message Broker (RabbitMQ)</text>
    <text x="220" y="74" font-size="14.5" fill="#334155" text-anchor="middle" font-weight="500">
      Perantara yang menerima, menyaring, dan merutekan event gizi antar 3 peran aplikasi SimGizi.
    </text>
  </g>

  <!-- ================= 1. PRODUCER (PUBLISHER) ================= -->
  <g transform="translate(45, 180)">
    <!-- Producer Card Container -->
    <rect x="0" y="0" width="200" height="250" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5" filter="url(#card-shadow)"/>
    
    <!-- Title -->
    <text x="100" y="38" font-size="18" font-weight="bold" fill="#0369a1" text-anchor="middle">Producer</text>
    <text x="100" y="58" font-size="13.5" fill="#0284c7" text-anchor="middle" font-weight="600">(Publisher)</text>

    <!-- Laptop / Web Icon -->
    <g transform="translate(56, 80)">
      <!-- Laptop Screen -->
      <rect x="4" y="0" width="80" height="52" rx="4" fill="#0284c7"/>
      <rect x="8" y="4" width="72" height="44" rx="2" fill="#e0f2fe"/>
      <line x1="16" y1="14" x2="48" y2="14" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="22" x2="64" y2="22" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="30" x2="40" y2="30" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <circle cx="56" cy="30" r="5" fill="#0369a1"/>
      <!-- Laptop Base -->
      <path d="M 0 52 L 88 52 C 88 56 84 58 78 58 L 10 58 C 4 58 0 56 0 52 Z" fill="#0369a1"/>
      <line x1="36" y1="53" x2="52" y2="53" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Label -->
    <text x="100" y="185" font-size="15" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Aplikasi Posyandu</text>
    <text x="100" y="205" font-size="12.5" fill="#0369a1" text-anchor="middle">(Web Next.js / Kader)</text>
    <rect x="25" y="217" width="150" height="20" rx="10" fill="#bae6fd"/>
    <text x="100" y="231" font-size="11" fill="#0369a1" font-weight="600" text-anchor="middle">Input Data &amp; Antropometri</text>
  </g>

  <!-- ================= ARROW 1 & CALLOUT PRODUCER -> BROKER ================= -->
  <!-- Arrow Line -->
  <line x1="245" y1="260" x2="435" y2="260" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <text x="340" y="230" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">1. Kirim pesan</text>
  <text x="340" y="248" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">(Format Event JSON)</text>

  <!-- Callout Message Box 1 -->
  <g transform="translate(262, 275)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="156" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="10" y="18" font-size="10.5" font-weight="bold" fill="#64748b">Contoh pesan event:</text>
    <text x="10" y="34" font-family="Consolas, monospace" font-size="10" fill="#0f172a">{</text>
    <text x="16" y="49" font-family="Consolas, monospace" font-size="9.5" fill="#0369a1">  "topic": "pengukuran",</text>
    <text x="16" y="64" font-family="Consolas, monospace" font-size="9.5" fill="#0284c7">  "anak": "Arfan",</text>
    <text x="16" y="79" font-family="Consolas, monospace" font-size="9.5" fill="#e11d48">  "status": "stunting",</text>
    <text x="16" y="94" font-family="Consolas, monospace" font-size="9.5" fill="#059669">  "zTbu": -3.61</text>
    <text x="10" y="105" font-family="Consolas, monospace" font-size="10" fill="#0f172a">}</text>
  </g>

  <!-- ================= 2. MESSAGE BROKER CONTAINER ================= -->
  <g transform="translate(440, 150)">
    <!-- Big Outer Broker Box -->
    <rect x="0" y="0" width="340" height="360" rx="16" fill="#f8fafc" stroke="#0284c7" stroke-width="3" filter="url(#card-shadow)"/>
    
    <!-- Title -->
    <text x="170" y="38" font-size="20" font-weight="bold" fill="#0369a1" text-anchor="middle">Message Broker</text>
    <text x="170" y="58" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="600">(RabbitMQ Topic Exchange Engine)</text>

    <!-- Sub-Box 1: Transformasi & Filter (Purple) -->
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="304" height="74" rx="10" fill="#f5f3ff" stroke="#c084fc" stroke-width="2"/>
      <text x="152" y="30" font-size="15" font-weight="bold" fill="#7e22ce" text-anchor="middle">Transformasi Pesan &amp; Filter</text>
      <text x="152" y="50" font-size="12" fill="#6b21a8" text-anchor="middle">(Validasi skema JSON &amp; status z-score)</text>
      <rect x="25" y="56" width="254" height="13" rx="4" fill="#ede9fe"/>
      <text x="152" y="65" font-size="9.5" fill="#7e22ce" font-weight="600" text-anchor="middle">Exchange: simgizi.events (Topic)</text>
    </g>

    <!-- Sub-Box 2: Routing (Green) -->
    <g transform="translate(18, 164)">
      <rect x="0" y="0" width="304" height="74" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
      <text x="152" y="30" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">Routing Berdasarkan Kategori</text>
      <text x="152" y="50" font-size="12" fill="#166534" text-anchor="middle">(Berdasarkan Routing Key: pengukuran.*, rujukan.*)</text>
      <rect x="25" y="56" width="254" height="13" rx="4" fill="#dcfce7"/>
      <text x="152" y="65" font-size="9.5" fill="#15803d" font-weight="600" text-anchor="middle">Topic Match: *.created, *.updated</text>
    </g>

    <!-- Sub-Box 3: Message Queue / Bus (Orange) -->
    <g transform="translate(18, 252)">
      <rect x="0" y="0" width="304" height="88" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text x="152" y="28" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Message Queue / Bus</text>
      <text x="152" y="46" font-size="11.5" fill="#9a3412" text-anchor="middle">(Antrean persisten aman dalam disk Docker)</text>
      <!-- 3 Miniature Queue Pills -->
      <rect x="12" y="56" width="86" height="22" rx="4" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
      <text x="55" y="70" font-size="8.5" fill="#9a3412" font-weight="bold" text-anchor="middle">puskesmas.triage</text>
      
      <rect x="108" y="56" width="90" height="22" rx="4" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
      <text x="153" y="70" font-size="8.5" fill="#9a3412" font-weight="bold" text-anchor="middle">ortu.notifikasi</text>
      
      <rect x="208" y="56" width="84" height="22" rx="4" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
      <text x="250" y="70" font-size="8.5" fill="#9a3412" font-weight="bold" text-anchor="middle">audit.laporan</text>
    </g>
  </g>

  <!-- ================= 3. CONSUMERS (SUBSCRIBERS) ================= -->

  <!-- ====== CONSUMER 1: PUSKESMAS (Green) ====== -->
  <g transform="translate(1010, 115)">
    <rect x="0" y="0" width="225" height="155" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" filter="url(#card-shadow)"/>
    <text x="112" y="28" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">Consumer 1</text>
    <text x="112" y="46" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="600">(Subscriber)</text>
    
    <!-- Hospital / Puskesmas Icon -->
    <g transform="translate(90, 56)">
      <rect x="0" y="0" width="44" height="40" rx="4" fill="#16a34a"/>
      <rect x="14" y="22" width="16" height="18" fill="#dcfce7"/>
      <!-- Cross -->
      <rect x="18" y="6" width="8" height="14" fill="#ffffff"/>
      <rect x="15" y="9" width="14" height="8" fill="#ffffff"/>
    </g>

    <text x="112" y="118" font-size="14.5" font-weight="bold" fill="#14532d" text-anchor="middle">Aplikasi Puskesmas</text>
    <text x="112" y="136" font-size="12" fill="#166534" text-anchor="middle">(Poli KIA &amp; Triage Medis)</text>
    <rect x="20" y="142" width="185" height="10" rx="4" fill="#bbf7d0"/>
  </g>

  <!-- Line & Callout to Consumer 1 -->
  <path d="M 780 200 C 840 200, 890 180, 1005 180" fill="none" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arrow-green)"/>
  <text x="895" y="155" font-size="12.5" font-weight="bold" fill="#15803d" text-anchor="middle">2a. Kirim pesan</text>
  <text x="895" y="172" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">(Triage Balita Berisiko)</text>
  <!-- Callout 1 -->
  <g transform="translate(820, 182)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="150" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="8" y="15" font-size="9.5" font-weight="bold" fill="#64748b">Contoh pesan rujukan:</text>
    <text x="8" y="32" font-family="Consolas, monospace" font-size="9" fill="#15803d">RUJUKAN|Arfan|Bojongsoang</text>
  </g>

  <!-- ====== CONSUMER 2: ORANG TUA (Orange) ====== -->
  <g transform="translate(1010, 290)">
    <rect x="0" y="0" width="225" height="155" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5" filter="url(#card-shadow)"/>
    <text x="112" y="28" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Consumer 2</text>
    <text x="112" y="46" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600">(Subscriber)</text>
    
    <!-- Bell Icon -->
    <g transform="translate(92, 56)">
      <circle cx="20" cy="18" r="16" fill="#f59e0b"/>
      <path d="M 14 12 C 14 8, 26 8, 26 12 L 28 22 L 12 22 Z" fill="#ffffff"/>
      <circle cx="20" cy="25" r="3" fill="#ffffff"/>
    </g>

    <text x="112" y="118" font-size="14.5" font-weight="bold" fill="#78350f" text-anchor="middle">Aplikasi Orang Tua</text>
    <text x="112" y="136" font-size="12" fill="#92400e" text-anchor="middle">(Portal Notifikasi &amp; Kurva WHO)</text>
    <rect x="20" y="142" width="185" height="10" rx="4" fill="#fde68a"/>
  </g>

  <!-- Line & Callout to Consumer 2 -->
  <line x1="780" y1="355" x2="1005" y2="355" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
  <text x="895" y="332" font-size="12.5" font-weight="bold" fill="#ea580c" text-anchor="middle">2b. Kirim pesan</text>
  <text x="895" y="348" font-size="11.5" font-weight="600" fill="#c2410c" text-anchor="middle">(Notifikasi &amp; Resep PMT)</text>
  <!-- Callout 2 -->
  <g transform="translate(820, 362)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="150" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="8" y="14" font-size="9" font-weight="bold" fill="#64748b">Contoh pesan ortu:</text>
    <text x="8" y="28" font-family="Consolas, monospace" font-size="8.5" fill="#0f172a">{"jenis": "resep_dokter",</text>
    <text x="8" y="42" font-family="Consolas, monospace" font-size="8.5" fill="#ea580c"> "anak": "Muhammad Arfan",</text>
    <text x="8" y="56" font-family="Consolas, monospace" font-size="8.5" fill="#059669"> "pmt": "Biskuit Protein"}</text>
  </g>

  <!-- ====== CONSUMER 3: AUDIT & DINKES (Purple) ====== -->
  <g transform="translate(1010, 470)">
    <rect x="0" y="0" width="225" height="155" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5" filter="url(#card-shadow)"/>
    <text x="112" y="28" font-size="16" font-weight="bold" fill="#7e22ce" text-anchor="middle">Consumer 3</text>
    <text x="112" y="46" font-size="12" fill="#9333ea" text-anchor="middle" font-weight="600">(Subscriber)</text>
    
    <!-- Report / Database Icon -->
    <g transform="translate(90, 56)">
      <rect x="4" y="2" width="36" height="36" rx="6" fill="#9333ea"/>
      <line x1="12" y1="12" x2="32" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="20" x2="28" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="28" x2="22" y2="28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="112" y="118" font-size="14" font-weight="bold" fill="#581c87" text-anchor="middle">Layanan Audit &amp; Log Server</text>
    <text x="112" y="136" font-size="11.5" fill="#6b21a8" text-anchor="middle">(Worker Daemon 'npm run worker')</text>
    <rect x="20" y="142" width="185" height="10" rx="4" fill="#e9d5ff"/>
  </g>

  <!-- Line & Callout to Consumer 3 -->
  <path d="M 780 430 C 840 430, 890 535, 1005 535" fill="none" stroke="#9333ea" stroke-width="2.8" marker-end="url(#arrow-purple)"/>
  <text x="895" y="475" font-size="12.5" font-weight="bold" fill="#7e22ce" text-anchor="middle">2c. Kirim pesan</text>
  <text x="895" y="492" font-size="11.5" font-weight="600" fill="#6b21a8" text-anchor="middle">(Audit &amp; Log Jejak)</text>
  <!-- Callout 3 -->
  <g transform="translate(820, 532)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="150" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="8" y="14" font-size="9" font-weight="bold" fill="#64748b">Contoh pesan audit:</text>
    <text x="8" y="28" font-family="Consolas, monospace" font-size="8.5" fill="#7e22ce">log_id=2026_0812;</text>
    <text x="8" y="42" font-family="Consolas, monospace" font-size="8.5" fill="#475569">event=rujukan.updated;</text>
    <text x="8" y="56" font-family="Consolas, monospace" font-size="8.5" fill="#15803d">status=ditindaklanjuti</text>
  </g>

  <!-- ================= RETURN / ACK ARROW (DASHED GREEN) ================= -->
  <path d="M 440 470 C 260 520, 160 510, 145 440" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash-green)"/>
  <rect x="180" y="470" width="240" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="300" y="486" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">3. (Opsional) Kirim respons / Ack</text>
  <text x="300" y="500" font-size="10.5" fill="#15803d" text-anchor="middle">(misalnya status penerimaan event OK 200)</text>

</svg>
